name: maystudio
region: nyc
features:
  - buildpack-stack=ubuntu-22

services:
  - name: backend
    dockerfile_path: backend/Dockerfile
    source_dir: backend
    http_port: 8000
    instance_count: 1
    instance_size_slug: basic-xxs
    routes:
      - path: /api
      - path: /admin
    envs:
      - key: DJANGO_SECRET_KEY
        scope: RUN_AND_BUILD_TIME
        type: SECRET
        value: "maystudio-prod-secret-key-change-in-dashboard"
      - key: DJANGO_DEBUG
        value: "False"
      - key: DJANGO_ALLOWED_HOSTS
        value: "*"
      - key: USE_POSTGRES
        value: "True"
      - key: POSTGRES_DB
        value: "${db.DATABASE}"


      - key: POSTGRES_USER
        value: "${db.USERNAME}"
      - key: POSTGRES_PASSWORD
        value: "${db.PASSWORD}"
      - key: POSTGRES_HOST
        value: "${db.HOSTNAME}"
      - key: POSTGRES_PORT
        value: "${db.PORT}"

static_sites:
  - name: frontend
    source_dir: frontend
    build_command: npm run build
    output_dir: dist
    routes:
      - path: /
    envs:
      - key: VITE_API_URL
        value: "${backend.PUBLIC_URL}/api"

databases:
  - name: db
    engine: PG
    version: "16"
    production: false
