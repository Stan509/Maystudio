services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: maystudio
      POSTGRES_USER: maystudio
      POSTGRES_PASSWORD: maystudio_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      DJANGO_SECRET_KEY: change-this-in-production
      DJANGO_DEBUG: "True"
      DJANGO_ALLOWED_HOSTS: "*"
      USE_POSTGRES: "True"
      POSTGRES_DB: maystudio
      POSTGRES_USER: maystudio
      POSTGRES_PASSWORD: maystudio_password
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
    ports:
      - "8000:8000"
    depends_on:
      - db

  frontend:
    build: ./frontend
    restart: unless-stopped
    environment:
      VITE_API_URL: http://127.0.0.1:8000/api
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  postgres_data:
